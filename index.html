<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090914">
<title>BICKS BOT | مركز الأوامر</title>
<style>
:root{--bg:#080812;--panel:#111124;--panel2:#17172e;--line:#292747;--text:#f5f3ff;--muted:#aaa6c5;--purple:#9b75ff;--pink:#df75ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#2a1450 0,transparent 38%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{width:min(1100px,92%);margin:auto;padding:38px 0 60px}
header{text-align:center;padding:30px 12px 26px}.logo{display:inline-grid;place-items:center;width:66px;height:66px;border-radius:22px;background:linear-gradient(135deg,#7045d8,#bd62e8);font-size:27px;font-weight:900;box-shadow:0 12px 40px #8b4dff44}
h1{font-size:clamp(29px,6vw,46px);margin:16px 0 7px;letter-spacing:.3px}.sub{color:var(--muted);margin:0}
.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0}.stat{background:#17152a;border:1px solid var(--line);padding:10px 16px;border-radius:14px;color:#dcd5ff}.stat b{color:#fff;font-size:19px;margin-left:5px}
.controls{position:sticky;top:8px;z-index:3;background:#0d0d1beF;border:1px solid var(--line);padding:13px;border-radius:18px;backdrop-filter:blur(14px);box-shadow:0 10px 35px #0005}
input{width:100%;background:#17172a;border:1px solid #343052;color:white;padding:14px 16px;border-radius:12px;font-size:16px;outline:none}input:focus{border-color:var(--purple)}
.filters{display:flex;gap:8px;overflow:auto;padding-top:11px;scrollbar-width:thin}.filter{white-space:nowrap;border:1px solid var(--line);background:#17172a;color:#c9c3e3;border-radius:30px;padding:8px 13px;cursor:pointer}.filter.active{background:linear-gradient(120deg,#7045d8,#9e55c5);border-color:transparent;color:white}
#count{color:var(--muted);font-size:13px;padding:15px 3px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;padding:15px;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#7659b8}.cmd{font-weight:750;color:#d7c5ff;font-size:16px;direction:ltr;text-align:left;display:block}.desc{color:var(--muted);font-size:13px;margin-top:8px;min-height:20px}.tag{display:inline-block;font-size:11px;color:#d5b9ff;background:#7045d822;border:1px solid #7045d855;padding:4px 8px;border-radius:20px;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:35px;display:none}footer{text-align:center;color:#77728f;font-size:12px;margin-top:35px}
@media(max-width:500px){.wrap{width:94%;padding-top:15px}header{padding-top:22px}.controls{top:4px}}
</style></head>
<body><main class="wrap">
<header><div class="logo">B</div><h1>BICKS BOT</h1><p class="sub">مركز الأوامر — ابحث وتصفح الأوامر حسب التصنيف</p>
<div class="stats"><div class="stat"><b>94</b> أمر مستخرج</div><div class="stat"><b>23</b> تصنيف</div></div></header>
<section class="controls"><input id="search" type="search" placeholder="ابحث باسم الأمر أو وصفه..." aria-label="البحث عن أمر"><div class="filters" id="filters"></div></section>
<div id="count"></div><section class="grid" id="grid"></section><div class="empty" id="empty">لا توجد نتائج مطابقة لبحثك.</div>
<footer>قائمة مستخرجة من ملفات البوت المحلية. قد تختلف الأوامر المتاحة حسب تشغيل الأنظمة وصلاحياتها.</footer>
</main>
<script>
const commands = [{"name": "set_log", "cat": "الإدارة", "desc": "تحديد قناة سجلات البوت"}, {"name": "role_panel", "cat": "الرتب", "desc": "عرض رتب السيرفر"}, {"name": "role_remove", "cat": "الرتب", "desc": "حذف الرتب القابلة للإدارة"}, {"name": "copy_roles", "cat": "الرتب", "desc": "نسخ الرتب من سيرفر مصدر"}, {"name": "copy_server", "cat": "الإدارة", "desc": "نسخ هيكل السيرفر وقنواته ورتبه"}, {"name": "give", "cat": "الرتب", "desc": "إعطاء رتبة لعضو"}, {"name": "take", "cat": "الرتب", "desc": "سحب رتبة من عضو"}, {"name": "give_all", "cat": "الرتب", "desc": "إعطاء رتبة للأعضاء الممكن تعديلهم"}, {"name": "take_all", "cat": "الرتب", "desc": "سحب رتبة من الأعضاء الممكن تعديلهم"}, {"name": "kick", "cat": "الإدارة", "desc": "طرد عضو"}, {"name": "ban", "cat": "الإدارة", "desc": "حظر عضو"}, {"name": "unban", "cat": "الإدارة", "desc": "فك حظر عضو"}, {"name": "timeout", "cat": "الإدارة", "desc": "إسكات عضو لمدة محددة"}, {"name": "replace_letters", "cat": "الرتب", "desc": "استبدال أحرف في أسماء الرتب"}, {"name": "sort_roles", "cat": "الرتب", "desc": "ترتيب الرتب القابلة للإدارة"}, {"name": "lock_all", "cat": "القنوات", "desc": "قفل إرسال الرسائل في القنوات النصية"}, {"name": "unlock_all", "cat": "القنوات", "desc": "استعادة إعدادات القنوات النصية"}, {"name": "hide", "cat": "القنوات", "desc": "إخفاء قناة عن الجميع"}, {"name": "show", "cat": "القنوات", "desc": "إظهار قناة واستعادة أذوناتها"}, {"name": "balance", "cat": "البنك", "desc": "عرض الرصيد"}, {"name": "daily", "cat": "البنك", "desc": "استلام المكافأة اليومية"}, {"name": "deposit", "cat": "البنك", "desc": "إيداع العملات في البنك"}, {"name": "withdraw", "cat": "البنك", "desc": "سحب العملات من البنك"}, {"name": "transfer", "cat": "البنك", "desc": "تحويل العملات إلى عضو"}, {"name": "leaderboard", "cat": "البنك", "desc": "عرض ترتيب الأعضاء حسب الرصيد"}, {"name": "bank", "cat": "البنك", "desc": "معلومات نظام البنك"}, {"name": "giveaway_start", "cat": "السحوبات", "desc": "إنشاء سحب جديد"}, {"name": "giveaway_end", "cat": "السحوب "إغلاق التقديمات"}, {"name": "apply", "cat": "التقديمات", "desc": "فتح نموذج التقديم"}, {"name": "help_admin", "cat": "المساعدة", "desc": "عرض قائمة أوامر البوت"}, {"name": "bot_servers", "cat": "مالك البوت", "desc": "عرض السيرفرات التي يوجد فيها البوت"}, {"name": "come", "cat": "الحضور والانصراف", "desc": "أمر الحضور"}, {"name": "personnel_permission", "cat": "الصلاحيات الوظيفية", "desc": "إدارة صلاحية وظيفية"}, {"name": "personnel_permissions", "cat": "الصلاحيات الوظيفية", "desc": "عرض أو إدارة الصلاحيات الوظيفية"}, {"name": "personnel_permission_remove", "cat": "الصلاحيات الوظيفية", "desc": "إزالة صلاحية وظيفية"}, {"name": "report", "cat": "التقارير", "desc": "التعامل مع التقارير"}, {"name": "violation", "cat": "المخالفات", "desc": "التعامل مع المخالفات"}, {"name": "record", "cat": "المخالفات", "desc": "تسجيل مخالفة"}, {"name": "promotion", "cat": "الترقيات والإجازات", "desc": "إجراء ترقية"}, {"name": "leave", "cat": "الترقيات والإجازات", "desc": "إدارة الإجازات"}, {"name": "approve", "cat": "مراجعة الطلبات", "desc": "قبول طلب"}, {"name": "reject", "cat": "مراجعة الطلبات", "desc": "رفض طلب"}, {"name": "statistics", "cat": "الإحصائيات", "desc": "عرض الإحصائيات"}, {"name": "search", "cat": "البحث", "desc": "البحث في بيانات النظام"}, {"name": "personnel_setup", "cat": "إعداد النظام", "desc": "إعداد نظام شؤون الموظفين"}, {"name": "setup_roles", "cat": "الرتب الذاتية", "desc": "إعداد الرتب الذاتية"}, {"name": "welcome_setup", "cat": "الترحيب", "desc": "إعداد نظام الترحيب"}, {"name": "welcome_message", "cat": "الترحيب", "desc": "إعداد رسالة الترحيب"}, {"name": "welcome_toggle", "cat": "الترحيب", "desc": "تفعيل أو إيقاف الترحيب"}, {"name": "welcome_test", "cat": "الترحيب", "desc": "اختبار رسالة الترحيب"}, {"name": "welcome_status", "cat": "الترحيب", "desc": "عرض حالة الترحيب"}, {"name": "welcome_create", "cat": "منشئ الترحيب", "desc": "إنشاء رسالة ترحيب"}, {"name": "welcome_designs", "cat": "منشئ الترحيب", "desc": "عرض تصاميم الترحيب"}, {"name": "welcome_select", "cat": "منشئ الترحيب", "desc": "اختيار تصميم ترحيب"}, {"name": "welcome_delete", "cat": "منشئ الترحيب", "desc": "حذف تصميم ترحيب"}, {"name": "welcome_builder", "cat": "منشئ الترحيب", "desc": "فتح منشئ الترحيب"}, {"name": "welcome_background", "cat": "منشئ الترحيب", "desc": "تغيير خلفية الترحيب"}, {"name": "welcome_preview", "cat": "منشئ الترحيب", "desc": "معاينة الترحيب"}, {"name": "ticket_setup", "cat": "التذاكر", "desc": "إعداد نظام التذاكر"}, {"name": "ticket_type_add", "cat": "التذاكر", "desc": "إضافة نوع تذكرة"}, {"name": "ticket_type_edit", "cat": "التذاكر", "desc": "تعديل نوع تذكرة"}, {"name": "ticket_questions", "cat": "التذاكر", "desc": "إعداد أسئلة التذكرة"}, {"name": "ticket_type_remove", "cat": "التذاكر", "desc": "حذف نوع تذكرة"}, {"name": "ticket_type_list", "cat": "التذاكر", "desc": "عرض أنواع التذاكر"}, {"name": "ticket_panel", "cat": "التذاكر", "desc": "عرض لوحة فتح التذاكر"}, {"name": "ticket_add_member", "cat": "التذاكر", "desc": "إضافة عضو إلى التذكرة"}, {"name": "ticket_remove_member", "cat": "التذاكر", "desc": "إزالة عضو من التذكرة"}, {"name": "ticket_rate", "cat": "التذاكر", "desc": "تقييم التذكرة"}, {"name": "ticket_stats", "cat": "التذاكر", "desc": "عرض إحصائيات التذاكر"}];
const cats = [...new Set(commands.map(x=>x.cat))];
let active = "الكل";
const filters = document.getElementById("filters"), grid=document.getElementById("grid"), search=document.getElementById("search");
function drawFilters(){filters.innerHTML="";["الكل",...cats].forEach(c=>{const b=document.createElement("button");b.className="filter"+(active===c?" active":"");b.textContent=c;b.onclick=()=>{active=c;drawFilters();draw()};filters.appendChild(b)})}
function draw(){const q=search.value.trim().toLowerCase();const list=commands.filter(x=>(active==="الكل"||x.cat===active)&&("/"+x.name+" "+x.desc+" "+x.cat).toLowerCase().includes(q));grid.innerHTML=list.map(x=>`<article class="card"><span class="cmd">/${x.name}</span><div class="desc">${x.desc}</div><span class="tag">${x.cat}</span></article>`).join("");document.getElementById("count").textContent=`عرض ${list.length} من ${commands.length} أمرًا`;document.getElementById("empty").style.display=list.length?"none":"block"}
search.addEventListener("input",draw);drawFilters();draw();
</script></body></html>
